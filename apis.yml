aid: cumbuca
name: Cumbuca
description: >-
  Cumbuca is a Banco Central do Brasil-licensed Payment Institution that provides
  regulated "proxy" access to Brazil's Pix and Open Finance networks. Acting as a
  thin, transparent layer with a 1:1 mapping to the official Open Finance Brasil
  and Central Bank API specifications, it forwards cryptographically signed
  requests between client infrastructure and the regulated ecosystem so fintechs
  can build directly on the rails without holding their own license (zero lock-in
  via certificate swap when they obtain one). Capabilities span Pix payment
  initiation, Open Finance account and credit-data access, recurring payments, and
  SCR credit-information queries, with a 0ms median latency overhead and a 99.99%
  availability SLA. Founded in 2021 in Sao Paulo and backed by Lightspeed Venture
  Partners and Y Combinator, Cumbuca also ships an Open Finance Data MCP server,
  the Regulus regulatory AI assistant, public status pages, and the open-source
  Open Finance Playground developer guide built with Juspay.
